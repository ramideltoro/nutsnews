name: Manual Cloudflare Production Cache Purge

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type purge-production-cache to confirm a targeted purge, or purge-everything-production for break glass.
        required: true
        type: string
      reason:
        description: Why are you manually purging the production Cloudflare cache?
        required: true
        type: string
      mode:
        description: Prefer tags; full-zone purge is break-glass only.
        required: true
        default: tags
        type: choice
        options:
          - tags
          - urls
          - everything
      targets:
        description: Comma-separated allowlisted tags or production HTTPS URLs (unused for everything).
        required: false
        default: site-shell
        type: string
      dry_run:
        description: Validate configuration without calling Cloudflare
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  deployments: read

concurrency:
  group: cloudflare-production-cache-purge
  cancel-in-progress: false

jobs:
  purge-cloudflare-production-cache:
    name: Manual purge Cloudflare production cache
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate manual purge confirmation
        env:
          CONFIRMATION: ${{ github.event.inputs.confirmation }}
        run: |
          if [[ "${{ github.event.inputs.mode }}" == "everything" && "$CONFIRMATION" != "purge-everything-production" ]]; then
            echo "Full-zone purge requires typed confirmation purge-everything-production." >&2
            exit 1
          fi
          if [[ "${{ github.event.inputs.mode }}" != "everything" && "$CONFIRMATION" != "purge-production-cache" ]]; then
            echo "Targeted cache purge requires typed confirmation purge-production-cache." >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22

      - name: Purge selected Cloudflare cache targets
        env:
          NUTSNEWS_RUNTIME_ENV: production
          NUTSNEWS_SIDE_EFFECTS_MODE: live
          NUTSNEWS_DATA_ENVIRONMENT: production
          NUTSNEWS_SUPABASE_CREDENTIALS_ENV: production
          NUTSNEWS_SUPABASE_PROJECT_REF: ${{ vars.NUTSNEWS_PRODUCTION_SUPABASE_PROJECT_REF }}
          NUTSNEWS_PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.NUTSNEWS_PRODUCTION_SUPABASE_PROJECT_REF }}
          NUTSNEWS_PUBLIC_SUPABASE_URL: ${{ vars.NUTSNEWS_PRODUCTION_SUPABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_PURGE_EVERYTHING: ${{ github.event.inputs.mode == 'everything' && 'true' || 'false' }}
          CLOUDFLARE_PURGE_CONFIRMATION: ${{ github.event.inputs.confirmation }}
          CLOUDFLARE_PURGE_TAGS: ${{ github.event.inputs.mode == 'tags' && github.event.inputs.targets || '' }}
          CLOUDFLARE_PURGE_URLS: ${{ github.event.inputs.mode == 'urls' && github.event.inputs.targets || '' }}
          CLOUDFLARE_PURGE_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          DEPLOYMENT_ENVIRONMENT: manual
          DEPLOYMENT_STATE: manual
          DEPLOYMENT_URL: ''
          MANUAL_PURGE_REASON: ${{ github.event.inputs.reason }}
        run: node scripts/cloudflare_purge_cache.mjs

      - name: Summarize manual purge path
        run: |
          {
            echo "## Manual Cloudflare production cache purge"
            echo
            echo "This workflow is an operator recovery path only. Normal PR deployments are validated before merge by \`Pre-merge deployment gate\` and do not trigger this workflow automatically."
            echo
            echo "- Dry run: \`${{ github.event.inputs.dry_run || 'false' }}\`"
            echo "- Mode: \`${{ github.event.inputs.mode }}\`"
            echo "- Targets: \`${{ github.event.inputs.targets || 'full zone' }}\`"
            echo "- Reason: ${{ github.event.inputs.reason }}"
          } >> "$GITHUB_STEP_SUMMARY"

name: Worker-Uplift Admin Evidence Contract

on:
  pull_request:
    paths:
      - .github/workflows/worker-uplift-admin-production-evidence.yml
      - .github/workflows/worker-uplift-admin-production-evidence-contract.yml
      - docs/WORKER_UPLIFT_ADMIN_PRODUCTION_EVIDENCE.md
      - scripts/worker_uplift_admin_production_evidence.mjs
      - scripts/validate_worker_uplift_admin_production_evidence.mjs
      - tests/worker-uplift-admin-production-evidence.test.mjs
      - web/package.json
      - web/package-lock.json
  push:
    branches:
      - main
    paths:
      - .github/workflows/worker-uplift-admin-production-evidence.yml
      - .github/workflows/worker-uplift-admin-production-evidence-contract.yml
      - docs/WORKER_UPLIFT_ADMIN_PRODUCTION_EVIDENCE.md
      - scripts/worker_uplift_admin_production_evidence.mjs
      - scripts/validate_worker_uplift_admin_production_evidence.mjs
      - tests/worker-uplift-admin-production-evidence.test.mjs
      - web/package.json
      - web/package-lock.json

permissions:
  contents: read

concurrency:
  group: worker-uplift-admin-evidence-contract-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    name: Validate evidence contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test read-only evidence contract
        working-directory: web
        run: npm run test:admin-worker-uplift-production-evidence

name: Worker-Uplift Authenticated Production Admin Evidence

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact deployed nutsnews source commit
        required: true
        type: string
      build_id:
        description: Exact immutable container build run-attempt
        required: true
        type: string
      deployment_id:
        description: Exact Vercel production deployment ID
        required: true
        type: string
      deployment_url:
        description: Exact immutable Vercel deployment URL
        required: true
        type: string
      target_origin:
        description: Canonical production origin
        required: true
        default: https://www.nutsnews.com
        type: string
      confirm_read_only:
        description: Type verify-authenticated-admin-read-only
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: worker-uplift-authenticated-admin-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live:
    name: Verify authenticated production admin status
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      BUILD_ID: ${{ inputs.build_id }}
      VERCEL_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
      VERCEL_DEPLOYMENT_URL: ${{ inputs.deployment_url }}
      TARGET_ORIGIN: ${{ inputs.target_origin }}
      CONFIRM_READ_ONLY: ${{ inputs.confirm_read_only }}
      EVIDENCE_TOOL_COMMIT: ${{ github.sha }}
      NUTSNEWS_ADMIN_EVIDENCE_EMAIL: ${{ secrets.NUTSNEWS_ADMIN_EVIDENCE_EMAIL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      EVIDENCE_PATH: ${{ github.workspace }}/worker-uplift-admin-evidence.json

    steps:
      - name: Validate immutable dispatch inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_commit must be a full lowercase SHA." >&2
            exit 1
          fi
          if [[ ! "$BUILD_ID" =~ ^[1-9][0-9]{0,19}-[1-9][0-9]{0,5}$ ]]; then
            echo "build_id must be an immutable workflow run-attempt." >&2
            exit 1
          fi
          if [[ ! "$VERCEL_DEPLOYMENT_ID" =~ ^dpl_[A-Za-z0-9]+$ ]]; then
            echo "deployment_id is invalid." >&2
            exit 1
          fi
          if [[ ! "$VERCEL_DEPLOYMENT_URL" =~ ^https://[A-Za-z0-9.-]+$ ]]; then
            echo "deployment_url must be a credential-free https origin." >&2
            exit 1
          fi
          if [[ "$TARGET_ORIGIN" != "https://www.nutsnews.com" ]]; then
            echo "target_origin must be the canonical production origin." >&2
            exit 1
          fi
          if [[ "$CONFIRM_READ_ONLY" != "verify-authenticated-admin-read-only" ]]; then
            echo "The exact read-only confirmation is required." >&2
            exit 1
          fi
          if [[ -z "$NUTSNEWS_ADMIN_EVIDENCE_EMAIL" || -z "$VERCEL_TOKEN" || -z "$VERCEL_ORG_ID" ]]; then
            echo "Protected production evidence credentials are incomplete." >&2
            exit 1
          fi

      - name: Checkout immutable evidence tool source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install exact web dependencies
        working-directory: web
        run: npm ci

      - name: Install evidence browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Verify authenticated production admin status
        run: node scripts/worker_uplift_admin_production_evidence.mjs

      - name: Validate sanitized evidence
        run: node scripts/validate_worker_uplift_admin_production_evidence.mjs "$EVIDENCE_PATH"

      - name: Retain sanitized evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: worker-uplift-authenticated-admin-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/worker-uplift-admin-evidence.json
          if-no-files-found: error
          retention-days: 90

name: Supabase Standby Manifest Regression

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/standby_manifest.json"
      - "supabase/migrations/**"
      - "scripts/migration_contract.mjs"
      - "scripts/supabase_standby_manifest.mjs"
      - "scripts/supabase_standby_manifest_regression.mjs"
      - "tests/migration-contract.test.mjs"
      - "tests/supabase-standby-manifest.test.mjs"
      - ".github/workflows/database-migration-gate.yml"
      - ".github/workflows/supabase-standby-manifest-regression.yml"
      - ".github/deployment/workflow-check-inventory.md"
      - ".github/deployment/environments-secrets-recovery.md"
      - "web/package.json"
  push:
    branches: [main]
    paths:
      - "supabase/standby_manifest.json"
      - "supabase/migrations/**"
      - "scripts/migration_contract.mjs"
      - "scripts/supabase_standby_manifest.mjs"
      - "scripts/supabase_standby_manifest_regression.mjs"
      - "tests/migration-contract.test.mjs"
      - "tests/supabase-standby-manifest.test.mjs"
      - ".github/workflows/database-migration-gate.yml"
      - ".github/workflows/supabase-standby-manifest-regression.yml"
      - ".github/deployment/workflow-check-inventory.md"
      - ".github/deployment/environments-secrets-recovery.md"
      - "web/package.json"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  regression:
    name: Verify standby manifest automation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Use Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: 22

      - name: Run standby manifest tests and workflow guard
        run: |
          set -euo pipefail
          node --test tests/supabase-standby-manifest.test.mjs
          node scripts/supabase_standby_manifest.mjs
          node scripts/supabase_standby_manifest_regression.mjs

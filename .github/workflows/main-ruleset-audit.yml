name: Main ruleset audit

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  administration: read

jobs:
  audit:
    name: Audit protected main ruleset
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Use Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: 22

      # Use the minimally scoped job token to avoid a long-lived secret that can become stale.
      - name: Audit live GitHub ruleset settings
        env:
          NUTSNEWS_RULESET_AUDIT_TOKEN: ${{ github.token }}
        run: node scripts/main_ruleset_audit.mjs
